batch_size: 16
learning_rate: 0.0001          # safer than 0.0003 for MobileNetV2 + federated
seed: 42
deterministic: false           # true is more reproducible but can be slower
val_generator_name: "NeuralTextures"           # held-out for validation (Reenactment)
test_generator_name: "DeepFaceLab"       # held-out for final test (Identity Swap)
# Training Epochs
teacher_epochs: 10
student_epochs: 10

# Loss weights
lambda_kd: 0.3
lambda_feat_kd: 0.5            # multi-level feature KD weight (semantic + forensic + embedding)

# Temperatures
temperature_kd: 2.0

# ----- Federated Learning -----
num_clients: 3            # number of federated clients
num_rounds: 12            # number of federated rounds (was 5 — model was still improving)
local_epochs: 2           # local training epochs per client per round (was 2)
clients_per_round: null   # null = all clients participate each round
fedprox_mu: 0.05          # proximal term weight (was 0.01 — too weak to prevent client drift)
iid_partition: false      # false = non-IID (split by generator, realistic)
