batch_size: 16
learning_rate: 0.0001          # safer than 0.0003 for MobileNetV2 + federated
seed: 42
deterministic: false           # true is more reproducible but can be slower
train_root: "D:\\ff++_extracted"
test_root: "D:\\DFDC_EXTRACTED"
val_split_ratio: 0.2
aug_grayscale_p: 0.2
aug_color_jitter_p: 0.3
# Training Epochs
teacher_epochs: 10             # 5 was severe underfitting for 35M params (Issue #6)
student_epochs: 5

# Loss weights
lambda_kd: 0.3
lambda_feat_kd: 0.1            # multi-level feature KD weight (semantic + forensic + embedding)

# Temperatures
temperature_kd: 2.0

num_clients: 2            # number of federated clients
num_rounds: 10             # increased from 3 — model was still improving at round 3
local_epochs: 2           # increased from 1 — 1 epoch per round is too few to learn
clients_per_round: null   # null = all clients participate each round
fedprox_mu: 0.01          # reduced from 0.2 — was preventing student from learning (Issue #8)
iid_partition: false      # false = non-IID (split by generator, realistic)
